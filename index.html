<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه مدیریت نمرات پیشرفته</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
<style>
body { margin:0; font-family:'Vazirmatn', sans-serif; background:#f3f4f6; }
.page { display:none; }
.active { display:block; animation:fade .5s ease; }
@keyframes fade { from{opacity:0} to{opacity:1} }
.container { padding:20px; }
.card { background:#fff; padding:20px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); margin-bottom:25px; transition:transform .3s; }
.card:hover { transform:translateY(-5px); }
button { padding:10px 20px; border:none; border-radius:12px; background:#4f46e5; color:#fff; cursor:pointer; margin:5px; transition:background .3s; }
button:hover { background:#4338ca; }
input, select { width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; margin:5px 0; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { padding:10px; border-bottom:1px solid #eee; text-align:center; }
th { background:#eef; }
.header { background:linear-gradient(135deg,#4f46e5,#7c3aed); padding:15px; text-align:center; color:#fff; font-size:20px; border-radius:0 0 15px 15px; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; }
.modal-content { background:#fff; padding:20px; border-radius:15px; width:90%; max-width:500px; max-height:90%; overflow:auto; position:relative; }
.close-btn { position:absolute; top:10px; left:10px; cursor:pointer; font-size:20px; color:#dc2626; }
.chart-bar { height:20px; background:#4f46e5; margin:5px 0; border-radius:10px; }
</style>
</head>
<body>

<div id="loginPage" class="page active">
<div class="card" style="max-width:360px;margin:100px auto;text-align:center;">
<h2>ورود به سامانه</h2>
<input id="loginCode" placeholder="کد ملی یا نام کاربری">
<input id="loginPass" type="password" placeholder="رمز (برای ادمین/معلم)">
<button onclick="loginUser()">ورود</button>
</div>
</div>

<div id="dashboardPage" class="page">
<div class="header" id="userRoleTitle">کارتابل</div>
<div class="container">
<div class="card">
<h3>کلاس‌ها</h3>
<select id="classSelect" onchange="renderClass()"></select>
</div>
<div class="card" id="studentsArea"></div>
<div class="card">
<button onclick="printClass()">📄 چاپ کارنامه</button>
<button onclick="logout()">خروج</button>
</div>
</div>
</div>

<div id="chartModal" class="modal">
<div class="modal-content">
<span class="close-btn" onclick="closeChart()">✖</span>
<h3 id="chartTitle"></h3>
<div id="chartArea"></div>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
